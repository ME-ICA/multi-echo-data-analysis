version: 1

project:
  title: "Multi-Echo fMRI Data Analysis"
  authors:
    - name: The tedana community
  copyright: "2021"
  github: https://github.com/ME-ICA/multi-echo-data-analysis
  bibliography:
    - content/references.bib
  exclude:
    - README.md
    - content/*.py
    - docs/**
    - meda/**
    - .venv/**
    - data/ds*/logs/*.md
    - data/ds*/*.md
    - content/ds*/logs/*.md
  references:
    tedana:
      url: https://tedana.readthedocs.io/en/0.0.11/

site:
  title: "Multi-Echo fMRI Data Analysis"
  options:
    logo: logo.png
    use_repository_button: true
    use_issues_button: true
    analytics:
      google_analytics: ""
    comments:
      hypothesis: true
